<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foconn</title>
    <style>
      /* 闪屏/启动加载动画的独立样式，不依赖任何外部 CSS 文件 */
      .foconn-app-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #141416; /* 匹配你应用的暗色调底色 */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .foconn-loading-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 科技感双环旋转动画 */
      .foconn-loading-spinner {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 3px solid transparent;
        border-top-color: #4496ff; /* 匹配应用主色调 rgba(68,150,255) */
        border-radius: 50%;
        animation: foconn-spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }

      .foconn-loading-spinner::before {
        content: "";
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: 4px;
        border: 3px solid transparent;
        border-top-color: #48bc98; /* 匹配应用辅助色/SFTP色 */
        border-radius: 50%;
        animation: foconn-spin-reverse 0.6s linear infinite;
      }

      .foconn-loading-text {
        font-size: 15px;
        font-weight: 500;
        color: #e4e4e7;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
      }

      .foconn-loading-sub {
        font-size: 12px;
        color: #71717a;
      }

      @keyframes foconn-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes foconn-spin-reverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="foconn-app-loading">
        <div class="foconn-loading-logo">
          <div class="foconn-loading-spinner"></div>
          </div>
        <div class="foconn-loading-text">FOCONN</div>
        <div class="foconn-loading-sub">...</div>
      </div>
    </div>
  </body>
</html>
